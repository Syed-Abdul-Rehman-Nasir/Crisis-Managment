# Render Blueprint — connect repo in dashboard or use "New Blueprint"
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ciro-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEMO_MODE
        value: "true"
      - key: USE_GEMINI
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "*"
